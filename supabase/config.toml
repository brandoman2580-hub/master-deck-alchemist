# Supabase function config — Phase 1a sanitation
# Only LIVE product + LIVE/UNKNOWN ops functions. Ghosts and NOT_LIVE removed.
# Undeploy of retired functions is Phase 5 (see _deprecated/supabase-functions/).

[functions.strategist]
enabled = true
verify_jwt = true
entrypoint = "./functions/strategist/index.ts"

[functions.embed]
enabled = true
verify_jwt = false
import_map = "./functions/embed/deno.json"
entrypoint = "./functions/embed/index.ts"

[functions.create-deck-share]
enabled = true
verify_jwt = true
entrypoint = "./functions/create-deck-share/index.ts"

[functions.get-deck-share]
enabled = true
verify_jwt = true
entrypoint = "./functions/get-deck-share/index.ts"

[functions.combo-compiler]
enabled = true
verify_jwt = true
entrypoint = "./functions/combo-compiler/index.ts"

[functions.meta-stats]
enabled = true
verify_jwt = false
import_map = "./functions/meta-stats/deno.json"
entrypoint = "./functions/meta-stats/index.ts"

[functions.sync-card-pool]
enabled = true
verify_jwt = true
import_map = "./functions/sync-card-pool/deno.json"
entrypoint = "./functions/sync-card-pool/index.ts"

[functions.update-master-duel-banlist]
enabled = true
verify_jwt = true
import_map = "./functions/update-master-duel-banlist/deno.json"
entrypoint = "./functions/update-master-duel-banlist/index.ts"

[functions.update-meta]
enabled = true
verify_jwt = false
import_map = "./functions/update-meta/deno.json"
entrypoint = "./functions/update-meta/index.ts"

[functions.sync-master-duel-rarity]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-master-duel-rarity/index.ts"

# Email Templates Configuration
[auth.email.template.recovery]
subject = "Reset Your Password"
content_path = "./supabase/templates/password_recovery.html"
