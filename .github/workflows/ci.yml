# GitHub Actions — test gate before merges to develop / master.
# Ported from bitbucket-pipelines.yml. See docs/deployment-environments.md.

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  storybook-tests:
    name: Storybook Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:storybook
        env:
          CI: true

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires repo secret CHROMATIC_PROJECT_TOKEN (chromatic.config.json already has projectId).
    if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true

  edge-tests:
    name: Edge function tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:edge

  lint:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    needs: [unit-tests, storybook-tests, edge-tests, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Playwright config
        id: playwright
        run: |
          if [ -f playwright.config.ts ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.playwright.outputs.configured == 'true'
        with:
          node-version: "20"
          cache: npm
      - if: steps.playwright.outputs.configured == 'true'
        run: npm ci
      - if: steps.playwright.outputs.configured == 'true'
        run: npx playwright install chromium --with-deps
      - if: steps.playwright.outputs.configured == 'true'
        run: npm run build
      - if: steps.playwright.outputs.configured == 'true'
        run: npm run test:e2e
        env:
          CI: true
      - if: steps.playwright.outputs.configured == 'false'
        run: echo "Skipping E2E — playwright.config.ts not present on this branch"
