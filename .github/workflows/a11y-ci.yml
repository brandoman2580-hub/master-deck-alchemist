name: Accessibility CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  a11y-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for baseline comparison
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install wait-on
        run: npm install --save-dev wait-on start-server-and-test
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
      
      - name: Start server and run accessibility scans
        run: |
          npx start-server-and-test start http://localhost:3000 30000 \
            'npm run a11y:scan-ci'
        env:
          PORT: 3000
      
      - name: Create reports directory
        run: mkdir -p reports
      
      - name: Run ESLint a11y checks
        run: |
          npm run a11y:lint -- --format json --output-file reports/eslint-a11y-report.json || true
        continue-on-error: true
      
      - name: Run jest-axe tests
        run: |
          npm run test:a11y -- --json --outputFile=reports/jest-a11y-results.json || true
        continue-on-error: true
      
      - name: Run pa11y-ci
        run: |
          npx pa11y-ci --json > reports/pa11y-report.json || true
        continue-on-error: true
        env:
          CI: true
      
      - name: Run Lighthouse CI
        run: |
          npx lhci autorun --collect.numberOfRuns=1 || true
        continue-on-error: true
      
      - name: Copy Lighthouse reports
        run: |
          if [ -d ".lighthouseci" ]; then
            mkdir -p reports
            cp -r .lighthouseci reports/ || true
          fi
        continue-on-error: true
      
      - name: Download baseline artifacts (if exists)
        uses: actions/download-artifact@v4
        with:
          name: a11y-baseline
          path: baseline
          if-no-found-files: ignore
        continue-on-error: true
      
      - name: Run diff check
        run: |
          node scripts/a11y-diff-check.js
        env:
          BASELINE_DIR: baseline
          CURRENT_DIR: reports
        continue-on-error: false
      
      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports-${{ github.run_number }}
          path: |
            reports/**
            baseline/**
          retention-days: 30
        if: always()
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let summary = '## 🔍 Accessibility Scan Results\n\n';
            
            // Try to read pa11y report
            const pa11yPath = path.join('reports', 'pa11y-report.json');
            if (fs.existsSync(pa11yPath)) {
              const pa11y = JSON.parse(fs.readFileSync(pa11yPath, 'utf-8'));
              const issues = pa11y.flatMap(r => r.issues || []);
              const critical = issues.filter(i => i.type === 'error').length;
              const warnings = issues.filter(i => i.type === 'warning').length;
              
              summary += `- **Pa11y:** ${critical} critical, ${warnings} warnings\n`;
            }
            
            // Try to read jest-axe results
            const jestPath = path.join('reports', 'jest-a11y-results.json');
            if (fs.existsSync(jestPath)) {
              const jest = JSON.parse(fs.readFileSync(jestPath, 'utf-8'));
              const failed = jest.testResults?.filter(t => t.status === 'failed').length || 0;
              summary += `- **Jest-axe:** ${failed} failed tests\n`;
            }
            
            summary += `\n[View full reports](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
        continue-on-error: true

