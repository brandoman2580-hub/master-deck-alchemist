name: Accessibility CI

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

jobs:
  a11y-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run jest-axe component tests
        run: npm run test:a11y

      - name: Build application
        run: npm run build

      - name: Run pa11y against production server
        run: npx start-server-and-test start http://localhost:3000 a11y:pa11y
        continue-on-error: true
        env:
          PORT: 3000

      - name: Diff check against baseline
        run: node scripts/a11y-diff-check.js
        continue-on-error: true
        env:
          BASELINE_DIR: baseline
          CURRENT_DIR: reports

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports-${{ github.run_number }}
          path: reports/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let summary = '## Accessibility Scan Results\n\n';
            summary += '- **Jest-axe:** component tests passed in CI\n';

            const pa11yPath = path.join('reports', 'pa11y-report.json');
            if (fs.existsSync(pa11yPath)) {
              const pa11y = JSON.parse(fs.readFileSync(pa11yPath, 'utf-8'));
              const issues = pa11y.flatMap(r => r.issues || []);
              const critical = issues.filter(i => i.type === 'error').length;
              const warnings = issues.filter(i => i.type === 'warning').length;
              summary += `- **Pa11y:** ${critical} critical, ${warnings} warnings\n`;
            }

            summary += `\n[View full reports](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
