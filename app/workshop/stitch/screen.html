<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MASTER DECK ALCHEMIST // WORKSHOP</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

            "on-secondary": "#26313f",
            "surface-dim": "#111317",
            "primary": "#f7fcff",
            "tertiary": "#fffaff",
            "outline-variant": "#41484a",
            "on-secondary-container": "#aab6c7",
            "on-secondary-fixed-variant": "#3c4856",
            "on-primary": "#0c3540",
            "inverse-primary": "#3f646f",
            "on-primary-fixed": "#001f27",
            "error-container": "#93000a",
            "background": "#111317",
            "on-secondary-fixed": "#111c29",
            "on-primary-container": "#436773",
            "on-background": "#e2e2e8",
            "surface-tint": "#a7ccda",
            "surface-container-lowest": "#0c0e12",
            "tertiary-fixed": "#ffddb4",
            "on-primary-fixed-variant": "#274c57",
            "tertiary-fixed-dim": "#e5c193",
            "secondary": "#bbc8d9",
            "outline": "#8b9295",
            "primary-fixed-dim": "#a7ccda",
            "on-error-container": "#ffdad6",
            "on-tertiary-fixed": "#291800",
            "inverse-on-surface": "#2f3035",
            "surface-container-high": "#282a2e",
            "on-error": "#690005",
            "primary-fixed": "#c3e9f7",
            "secondary-fixed-dim": "#bbc8d9",
            "surface-container": "#1e2024",
            "surface-container-low": "#1a1c20",
            "inverse-surface": "#e2e2e8",
            "surface-variant": "#333539",
            "on-surface": "#e2e2e8",
            "secondary-fixed": "#d7e3f5",
            "on-surface-variant": "#c1c7cb",
            "secondary-container": "#3c4856",
            "surface-bright": "#37393e",
            "on-tertiary": "#422c0b"
          },
          "borderRadius": {
            "DEFAULT": "0px",

<style>
    * {
      border-radius: 0px !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }
    body {
      background-color: #0c0e12;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0c0e12]">
<!-- Top Bar: Fixed or docked, strictly minimal as requested -->
<header class="w-full h-16 min-h-[44px] bg-[#111317] border-b border-[#28303b] px-6 md:px-8 flex items-center justify-between shrink-0 z-50">
<div class="flex items-center">
<span class="font-orbitron text-[14px] uppercase tracking-wide text-[#f1f5f9] font-bold select-none">
        MASTER DECK ALCHEMIST
      </span>
</div>
<div>
<button class="min-h-[44px] h-[44px] px-5 bg-[#14181f] border border-[#28303b] hover:border-[#bfe5f3] flex items-center gap-3 transition-colors group focus:outline-none focus:border-[#bfe5f3]" type="button">
<span class="font-headline-sm text-headline-sm text-[#e2e8f0] text-xs font-semibold tracking-wider">ARCHIVES</span>
<span aria-hidden="true" class="w-[2px] h-[10px] bg-[#bfe5f3] inline-block"></span>
</button>
</div>
</header>
<!-- Main Container -->
<main class="flex-1 w-full flex flex-col p-6 md:p-8 gap-6 max-w-[1600px] mx-auto box-border">
<!-- Workshop Header Sleeve: Two distinct plates separated by chassis gap -->
<section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
<!-- Left Sentence (Plate 1): Deck identity & specifications -->
<div class="lg:col-span-7 bg-[#14181f] border border-[#28303b] p-4 flex flex-col sm:flex-row items-start sm:items-center gap-6">
<!-- Empty Portrait Card: exact 72px x 104px, no text, aria-hidden -->
<div aria-hidden="true" class="w-[72px] h-[104px] shrink-0 bg-[#1b2028] border border-[#28303b]"></div>
<!-- Beside Card Group -->
<div class="flex flex-col justify-center gap-3 min-w-0 flex-1">
<!-- Deck identity row -->
<div class="flex items-center gap-3">
<h1 class="font-headline-md text-headline-md font-bold text-[#ffffff] tracking-tight truncate">
              BRANDED DESPIA
            </h1>
<button aria-label="Edit deck name" class="w-[44px] h-[44px] min-h-[44px] min-w-[44px] flex items-center justify-center border border-transparent hover:border-[#28303b] focus:outline-none focus:border-[#bfe5f3] transition-colors text-[#8a96a6] hover:text-[#e2e8f0]" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M16.5 3.5l4 4L7 21H3v-4L16.5 3.5z"></path>
</svg>
</button>
</div>
<!-- Format and Counts unified cluster + Warning Pip -->
<div class="flex flex-wrap items-center gap-y-2 gap-x-4 border-t border-[#28303b] pt-2 text-[14px]">
<div class="flex items-center gap-1.5 font-label-caps text-label-caps tracking-widest text-[#8a96a6]">
<span>FORMAT:</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm text-xs font-semibold">TCG</span>
</div>
<div aria-hidden="true" class="w-[1px] h-3 bg-[#28303b]"></div>
<!-- Unified card counts group -->
<div class="flex items-center gap-3 font-label-caps text-label-caps tracking-widest text-[#8a96a6]">
<div class="flex items-center gap-1">
<span>MAIN</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm text-xs font-semibold">40</span>
</div>
<div class="flex items-center gap-1">
<span>EXTRA</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm text-xs font-semibold">15</span>
</div>
<div class="flex items-center gap-1">
<span>SIDE</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm text-xs font-semibold">15</span>
</div>
</div>
<!-- Triangular Warning Mark SVG (Ice #bfe5f3) with banlist fault title -->
<div class="flex items-center pl-1" title="Banlist fault">
<svg aria-label="Banlist fault" class="w-4 h-4 text-[#bfe5f3] fill-current" role="img" viewbox="0 0 24 24">
<polygon points="12,3 22,21 2,21"></polygon>
</svg>
</div>
</div>
</div>
</div>
<!-- Right Sentence (Plate 2): Separate recessed plate for Grade and Pillar scores -->
<div class="lg:col-span-5 bg-[#14181f] border border-[#28303b] p-4 flex flex-col justify-between">
<div class="flex items-baseline justify-between border-b border-[#28303b] pb-2 mb-3">
<span class="font-label-caps text-label-caps text-[#8a96a6] tracking-widest uppercase">GRADE</span>
<span class="text-2xl font-bold text-[#e2e8f0] leading-none">B</span>
</div>
<!-- Pillar scores: strictly CONSISTENCY, POWER, RESILIENCE, DISRUPTION -->
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-[11px] text-[#8a96a6] uppercase tracking-wider mb-1">CONSISTENCY</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm font-semibold text-sm">82</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-[11px] text-[#8a96a6] uppercase tracking-wider mb-1">POWER</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm font-semibold text-sm">79</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-[11px] text-[#8a96a6] uppercase tracking-wider mb-1">RESILIENCE</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm font-semibold text-sm">74</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-[11px] text-[#8a96a6] uppercase tracking-wider mb-1">DISRUPTION</span>
<span class="text-[#e2e8f0] font-headline-sm text-headline-sm font-semibold text-sm">68</span>
</div>
</div>
</div>
</section>
<!-- Navigation Tabs -->
<nav aria-label="Workshop Mode Selection" class="flex items-center gap-1 border-b border-[#28303b]">
<!-- BUILD Tab (Selected) -->
<button class="min-h-[44px] h-[44px] px-6 bg-[#e2e8f0] text-[#0c0e12] font-headline-sm text-headline-sm text-xs font-bold tracking-widest flex items-center gap-2 border-t-2 border-[#bfe5f3] focus:outline-none" type="button">
<span>BUILD</span>
<span aria-hidden="true" class="w-[2px] h-[10px] bg-[#bfe5f3]"></span>
</button>
<!-- MATCHUPS Tab -->
<button class="min-h-[44px] h-[44px] px-6 bg-transparent text-[#8a96a6] hover:text-white font-headline-sm text-headline-sm text-xs font-medium tracking-widest flex items-center transition-colors focus:outline-none focus:border-[#bfe5f3]" type="button">
        MATCHUPS
      </button>
<!-- COMBOS Tab -->
<button class="min-h-[44px] h-[44px] px-6 bg-transparent text-[#8a96a6] hover:text-white font-headline-sm text-headline-sm text-xs font-medium tracking-widest flex items-center transition-colors focus:outline-none focus:border-[#bfe5f3]" type="button">
        COMBOS
      </button>
</nav>
<!-- Work Area: Empty pristine specification sheet -->
<div class="flex-1 min-h-[480px] bg-[#eef3f6] border border-[#28303b] p-6">
<span class="font-headline-sm text-headline-sm font-bold text-[#0c0e12] tracking-wider select-none">
        BUILD
      </span>
</div>
</main>
</body></html>
