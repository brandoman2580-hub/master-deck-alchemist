# Bitbucket Pipelines — test gate before merges to develop / master.
# Docs: docs/deployment-environments.md

image: node:20

definitions:
  caches:
    npm: $HOME/.npm
  steps:
    - step: &unit-tests
        name: Unit tests
        caches:
          - node
        script:
          - export NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          - export NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          - npm ci
          - npm run test:unit

    - step: &edge-tests
        name: Edge function tests
        caches:
          - node
        script:
          - curl -fsSL https://deno.land/install.sh | sh
          - export DENO_INSTALL="$HOME/.deno"
          - export PATH="$DENO_INSTALL/bin:$PATH"
          - deno test --allow-read --allow-env --allow-net supabase/functions/deck-assistant/tests/query-router.test.ts supabase/functions/deck-assistant/tests/category-prompts.test.ts supabase/functions/deck-assistant/tests/rag-strategy.test.ts supabase/functions/enrich-cards/tests/signals.test.ts

    - step: &lint
        name: Lint
        caches:
          - node
        script:
          - npm ci
          - npm run lint

    - step: &build
        name: Build
        caches:
          - node
        script:
          - export NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          - export NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          - npm ci
          - npm run build

    - step: &e2e
        name: E2E (Playwright)
        size: 2x
        caches:
          - node
        script:
          - export NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          - export NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          - export CI=true
          - npm ci
          - npx playwright install chromium --with-deps
          - npm run build
          - npm run test:e2e

pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *unit-tests
          - step: *edge-tests
          - step: *lint

  branches:
    develop:
      - parallel:
          - step: *unit-tests
          - step: *edge-tests
          - step: *lint
      - step: *build
      - step: *e2e

    master:
      - parallel:
          - step: *unit-tests
          - step: *edge-tests
          - step: *lint
      - step: *build
      - step: *e2e

    "feature/**":
      - parallel:
          - step: *unit-tests
          - step: *edge-tests
          - step: *lint

    "fix/**":
      - parallel:
          - step: *unit-tests
          - step: *edge-tests
          - step: *lint
